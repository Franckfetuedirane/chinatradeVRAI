<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexion FOESA</title>
    <style>
      :root { --bg:#f3f7ff; --panel:#fff; --ink:#0f1e38; --muted:#62728f; --primary:#0a5fd7; --primary2:#6d28d9; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; font-family:Segoe UI, Arial, sans-serif; color:var(--ink); background:radial-gradient(circle at 10% 10%, #e8f1ff 0, #f5f8ff 38%, #f3f7ff 100%); display:grid; place-items:center; }
      .shell { width:min(460px, 92vw); background:var(--panel); border-radius:18px; padding:26px; box-shadow:0 18px 40px rgba(16,35,78,.18); }
      h1 { margin:0 0 6px; font-size:28px; }
      p { margin:0 0 20px; color:var(--muted); }
      label { display:block; margin:10px 0 6px; font-size:13px; font-weight:600; color:#31486f; }
      input { width:100%; border:1px solid #c6d8f2; border-radius:12px; padding:11px 12px; font:inherit; }
      input:focus { outline:0; border-color:#8fb3ec; box-shadow:0 0 0 3px rgba(42,103,212,.16); }
      .err { background:#fee2e2; color:#7f1d1d; border-radius:10px; padding:10px 12px; margin:0 0 12px; font-size:14px; }
      button { width:100%; border:0; border-radius:12px; padding:11px 12px; cursor:pointer; color:#fff; font-weight:700; background:linear-gradient(90deg, var(--primary), var(--primary2)); margin-top:14px; }
      .hint { margin-top:14px; font-size:12px; color:var(--muted); text-align:center; }
      .hint a { color:#235fcb; text-decoration:none; }
    </style>
  </head>
  <body>
    <form class="shell" method="post">
      {% csrf_token %}
      <h1>FOESA</h1>
      <p>Connexion securisee au back office</p>

      {% if form.non_field_errors %}
        <div class="err">{{ form.non_field_errors }}</div>
      {% endif %}

      <label for="id_username">Nom d'utilisateur</label>
      {{ form.username }}

      <label for="id_password">Mot de passe</label>
      {{ form.password }}

      {% if next %}<input type="hidden" name="next" value="{{ next }}" />{% endif %}
      <button type="submit">Se connecter</button>
      <div class="hint">Besoin de l'admin Django ? <a href="/admin/">Ouvrir /admin</a></div>
    </form>
  </body>
</html>
